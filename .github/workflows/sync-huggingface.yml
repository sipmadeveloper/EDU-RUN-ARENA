name: Deploy Otomatis ke Hugging Face Spaces

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Python & Hugging Face Hub CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --quiet --upgrade huggingface_hub

      - name: Sinkronkan seluruh proyek ke Hugging Face Space (termasuk gambar/logo otomatis)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python3 - << 'EOF'
          import os, sys
          from huggingface_hub import HfApi

          token = (os.environ.get("HF_TOKEN") or "").strip()
          space_name = (os.environ.get("HF_SPACE_NAME") or "edu-run-arena-3d").strip()

          if not token:
              print("GAGAL: Secret HF_TOKEN belum diisi di GitHub -> Settings -> Secrets and variables -> Actions.")
              sys.exit(1)

          api = HfApi(token=token)

          # Ambil username persis dari token agar tidak pernah gagal karena salah ketik HF_USERNAME
          try:
              info = api.whoami()
              username = info["name"]
              print(f"Login Hugging Face berhasil sebagai: {username}")
          except Exception as exc:
              print(f"GAGAL: HF_TOKEN tidak valid atau kedaluwarsa. Detail: {exc}")
              print("Pastikan membuat token bertipe WRITE di https://huggingface.co/settings/tokens lalu tempel ulang ke secret HF_TOKEN.")
              sys.exit(1)

          repo_id = f"{username}/{space_name}"

          # Pastikan Space Docker publik tersedia (membuat otomatis jika belum ada)
          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  private=False,
                  exist_ok=True,
              )
          except Exception as exc:
              print(f"GAGAL membuat/mengakses Space {repo_id}. Detail: {exc}")
              print("Pastikan HF_TOKEN bertipe WRITE (bukan Read), atau jika Fine-grained centang izin Write repos & Spaces.")
              sys.exit(1)

          # Upload seluruh proyek (otomatis menangani file PNG/aset biner via LFS tanpa error)
          try:
              api.upload_folder(
                  folder_path=".",
                  repo_id=repo_id,
                  repo_type="space",
                  commit_message="Auto-deploy EDU RUN ARENA 3D dari GitHub",
                  ignore_patterns=[
                      ".git",
                      ".git/**",
                      ".github",
                      ".github/**",
                      "node_modules",
                      "node_modules/**",
                      "dist",
                      "dist/**",
                      "data",
                      "data/**",
                      ".aistudio",
                      ".aistudio/**",
                      ".env",
                      ".env.*",
                      "*.log",
                      "*.db",
                      "*.db-wal",
                      "*.db-shm",
                  ],
              )
          except Exception as exc:
              print(f"GAGAL mengunggah file ke Space {repo_id}. Detail: {exc}")
              sys.exit(1)

          slug_user = username.lower().replace("_", "-")
          slug_space = space_name.lower().replace("_", "-")
          print(f"BERHASIL! Space sedang di-build di: https://huggingface.co/spaces/{repo_id}")
          print(f"URL Langsung Aplikasi Anda: https://{slug_user}-{slug_space}.hf.space")
          EOF
