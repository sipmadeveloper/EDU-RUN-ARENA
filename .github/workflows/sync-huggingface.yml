name: Deploy Otomatis ke Hugging Face Spaces

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Python & Hugging Face Hub CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Sinkronkan seluruh proyek ke Hugging Face Space (termasuk gambar/logo otomatis)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python3 - << 'EOF'
          import os, sys
          from huggingface_hub import HfApi

          token = (os.environ.get("HF_TOKEN") or "").strip()
          username = (os.environ.get("HF_USERNAME") or "").strip()
          space_name = (os.environ.get("HF_SPACE_NAME") or "edu-run-arena-3d").strip()

          if not token or not username:
              print("INFO: Secret HF_TOKEN atau HF_USERNAME belum diisi di GitHub Settings -> Secrets -> Actions.")
              print("Tambahkan kedua secret tersebut lalu jalankan ulang workflow ini (Run workflow).")
              sys.exit(0)

          repo_id = f"{username}/{space_name}"
          api = HfApi(token=token)

          # Pastikan Space Docker publik tersedia (membuat otomatis jika belum ada)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
          )

          # Upload seluruh proyek (otomatis menangani file PNG/aset biner via LFS tanpa error)
          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Auto-deploy EDU RUN ARENA 3D dari GitHub",
              ignore_patterns=[
                  ".git",
                  ".git/*",
                  ".github",
                  ".github/*",
                  "node_modules",
                  "node_modules/*",
                  "dist",
                  "dist/*",
                  "data",
                  "data/*",
                  ".aistudio",
                  ".aistudio/*",
                  ".env",
                  ".env.*",
                  "*.log",
                  "*.db",
                  "*.db-wal",
                  "*.db-shm",
              ],
          )

          slug_user = username.lower().replace("_", "-")
          slug_space = space_name.lower().replace("_", "-")
          print(f"BERHASIL! Space sedang di-build di: https://huggingface.co/spaces/{repo_id}")
          print(f"URL Langsung Aplikasi Anda: https://{slug_user}-{slug_space}.hf.space")
          EOF
